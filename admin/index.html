<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - GeneratorUPS</title>

    <link rel="stylesheet" href="../style.css" />
  </head>
  <body data-theme="light">
    <button id="themeToggle" aria-label="Cambiar tema">🌙</button>

    <h2>Admin - GeneratorUPS</h2>
    <p><a href="../index.html">&larr; Volver al formulario</a></p>

    <div id="loginView" class="card">
      <h3>Iniciar sesión</h3>
      <form id="formLogin">
        <label>Usuario</label>
        <input id="loginUsuario" required autocomplete="username" />

        <label>Contraseña</label>
        <input
          id="loginPassword"
          type="password"
          required
          autocomplete="current-password"
        />

        <button type="submit">Ingresar</button>
      </form>
      <p id="loginError" class="oculto" style="color: #c0392b"></p>
    </div>

    <div id="adminView" class="oculto">
      <p>
        <button type="button" id="logoutBtn" class="secundario">
          Cerrar sesión
        </button>
      </p>

      <div class="card">
        <h3>Dispositivos</h3>

      <label>Línea</label>
      <select id="admLinea">
        <option value="verisure">Verisure</option>
        <option value="presense">Presense</option>
      </select>

      <form id="formDispositivo">
        <input type="hidden" id="dispEditId" />

        <label>Nombre</label>
        <input id="dispNombre" required />

        <div class="row">
          <div>
            <label>Valor Alto</label>
            <input id="dispAlto" type="number" step="0.01" />
          </div>
          <div>
            <label>Valor Medio</label>
            <input id="dispMedio" type="number" step="0.01" />
          </div>
          <div>
            <label>Valor Bajo</label>
            <input id="dispBajo" type="number" step="0.01" />
          </div>
          <div>
            <label>Valor Financiado</label>
            <input id="dispFinanciado" type="number" step="0.01" />
          </div>
          <div>
            <label>Promo 50%</label>
            <input id="dispPromoCincuenta" type="number" step="0.01" />
          </div>
          <div>
            <label>Mensual (adicional RMR)</label>
            <input id="dispMensual" type="number" step="0.01" />
          </div>
          <div>
            <label>RMR 3 días (Arlo)</label>
            <input id="dispRmr3dias" type="number" step="0.01" />
          </div>
          <div>
            <label>RMR 7 días (Arlo)</label>
            <input id="dispRmr7dias" type="number" step="0.01" />
          </div>
          <div>
            <label>RMR 14 días (Arlo)</label>
            <input id="dispRmr14dias" type="number" step="0.01" />
          </div>
          <div>
            <label>RMR 30 días (Arlo)</label>
            <input id="dispRmr30dias" type="number" step="0.01" />
          </div>
          <div>
            <label>Tipo de plan (Arlo)</label>
            <select id="dispTipoPlan">
              <option value="">-</option>
              <option value="SMART">SMART</option>
              <option value="CVR">CVR</option>
            </select>
          </div>
        </div>

        <button type="submit" id="dispSubmitBtn">Agregar dispositivo</button>
        <button type="button" id="dispCancelarBtn" class="secundario oculto">
          Cancelar edición
        </button>
      </form>

      <table id="tablaDispositivos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Alto</th>
            <th>Medio</th>
            <th>Bajo</th>
            <th>Financiado</th>
            <th>Promo 50%</th>
            <th>Mensual</th>
            <th>RMR 3d</th>
            <th>RMR 7d</th>
            <th>RMR 14d</th>
            <th>RMR 30d</th>
            <th>Plan</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Operadores</h3>

      <form id="formOperador">
        <input type="hidden" id="opEditId" />

        <label>Nombre</label>
        <input id="opNombre" required />

        <label>Matrícula</label>
        <input id="opMatricula" required />

        <button type="submit" id="opSubmitBtn">Agregar operador</button>
        <button type="button" id="opCancelarBtn" class="secundario oculto">
          Cancelar edición
        </button>
      </form>

      <table id="tablaOperadores">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Matrícula</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      </div>
    </div>
  </body>

  <script type="module" src="../src/theme.js"></script>
  <script type="module" src="admin.js"></script>
</html>
