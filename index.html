<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador de Speech - Upselling</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body data-theme="light">
    <button id="themeToggle" aria-label="Cambiar tema">🌙</button>

    <h2>Generador de Speech - Ampliación / Upselling</h2>

    <div class="card">
      <label>Dispositivos</label>
      <div id="dispositivosWrap"></div>
      <button type="button" onclick="agregarDispositivo()">
        + Agregar dispositivo
      </button>

      <label>Cartera</label>
      <select id="cartera">
        <option value="IN">IN</option>
        <option value="OUT">OUT</option>
      </select>

      <label>Tipo de pago</label>
      <select id="tipoPago">
        <option value="transferencia">1 Pago - Transferencia</option>
        <option value="tarjeta">1 Pago - Tarjeta de Crédito</option>
        <option value="financiado">Financiado</option>
      </select>

      <div id="cuotasWrap" class="oculto">
        <label>Cantidad de cuotas</label>
        <select id="cuotas"></select>
      </div>

      <label>Operador</label>
      <select id="operador"></select>

      <label>Campaña</label>
      <select id="campana"></select>

      <div class="row">
        <div>
          <label>Fecha de visita</label>
          <input type="date" id="fechaVisita">
        </div>
        <div>
          <label>Hora desde</label>
          <input type="time" id="horaDesde">
        </div>
        <div>
          <label>Hora hasta</label>
          <input type="time" id="horaHasta">
        </div>
      </div>

      <label>Comentarios adicionales</label>
      <textarea id="comentariosAdicionales" placeholder="Comentarios adicionales"></textarea>

      <button onclick="generar()">Generar Speech</button>
    </div>

    <div class="card">
      <label>Resultado Mantenimiento</label>
      <div id="resultado" contenteditable="true">-</div>
      <button class="copiar" onclick="copiar()">Copiar</button>
    </div>

    <div class="card">
      <label>Resultado ComLog</label>
      <div id="resultadoComLog" contenteditable="true">-</div>
      <button class="copiar" onclick="copiarComLog()">Copiar</button>
    </div>

  </body>

<script type="module" src="src/theme.js"></script>
<script type="module" src="main.js"></script>
</html>
