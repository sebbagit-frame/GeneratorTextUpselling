<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador PreSense - Cambio de Tecnología</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" href="../src/image/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-theme="light" class="presense-page">
    <button id="themeToggle" aria-label="Cambiar tema">🌙</button>

    <h2>Generador PreSense - Cambio de Tecnología</h2>
    <p><a href="../index.html">&larr; Volver al Upselling</a></p>

    <div class="card">
      <label>Nro de instalación</label>
      <input id="nroInst" placeholder="1532243" />

      <label>Zona</label>
      <input id="zona" placeholder="Agronomía, CABA CP 1431" />

      <div class="row">
        <div>
          <label>Forma de pago (upfront)</label>
          <select id="formaPago">
            <option value="cuotas">En cuotas</option>
            <option value="unico">Pago único</option>
          </select>
        </div>
      </div>

      <div class="row" id="filaCuotas">
        <div>
          <label>Cantidad de cuotas</label>
          <select id="cuotasFinanciamiento">
            <option value="3">3 cuotas</option>
            <option value="6">6 cuotas</option>
            <option value="12">12 cuotas</option>
          </select>
        </div>
      </div>

      <label>Comentarios adicionales</label>
      <small class="texto-ayuda">En caso de que el cliente haya indicado una fecha aproximada, escribir acá abajo</small>
      <textarea id="comentariosAdicionales" placeholder="Comentarios adicionales"></textarea>

      <label>Mensualidad vigente del cliente</label>
      <input type="number" id="mensualidadVigente" placeholder="0" step="0.01" />
      <small class="texto-ayuda">En caso de corresponder decimal, usar punto (" . ")</small>

      <label style="display:flex;align-items:center;gap:8px;margin-top:14px">
        <input type="checkbox" id="fueAbonado" style="width:auto">
        ¿Fue abonado?
      </label>

      <div class="row">
        <div>
          <label>Cartera</label>
          <select id="psCartera">
            <option value="IN">IN</option>
            <option value="OUT">OUT</option>
          </select>
        </div>
        <div>
          <label>Campaña</label>
          <select id="psCampana"></select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="labelKits">Kits</label>
      <div id="kitsList"></div>
    </div>

    <div class="card">
      <label>Dispositivos</label>
      <div id="dispositivosList"></div>
      <button type="button" id="addDisp">+ Agregar dispositivo</button>
    </div>

    <button type="button" id="generar">Generar cuadro</button>

    <div class="presense-resultados">
      <div class="card oculto" id="resultadoSpeechWrap">
        <label>Speech ComLog</label>
        <div id="outSpeechComLog" contenteditable="true">-</div>
        <button class="copiar" id="copiarSpeechComLog">Copiar</button>
      </div>

      <div class="card oculto" id="resultadoCuerpoMailWrap">
        <label>MAIL + CUADRO</label>
        <div id="outCuerpoMail" contenteditable="true">-</div>
        <button class="copiar" id="copiarCuerpoMail">Copiar</button>
      </div>
    </div>

    <button type="button" class="secundario oculto" id="volver">Editar datos</button>
  </body>

  <script type="module" src="../src/theme.js"></script>
  <script type="module" src="presense.js"></script>
</html>
